<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="6" y1="2" x2="58" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="0.5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="shine" x1="10" y1="6" x2="54" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <filter id="soft" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.6" flood-color="#312e81" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Rounded square base -->
  <rect width="64" height="64" rx="15" fill="url(#bg)"/>

  <!-- Ambient glows -->
  <circle cx="47" cy="13" r="15" fill="#ffffff" opacity="0.16"/>
  <circle cx="10" cy="55" r="13" fill="#4c1d95" opacity="0.28"/>

  <!-- Back flashcard peeking (tilted) -->
  <g transform="rotate(-16 30 34)">
    <rect x="12" y="14" width="34" height="34" rx="7" fill="#c7d2fe" opacity="0.55"/>
  </g>

  <!-- Front flashcard -->
  <g transform="rotate(-7 33 34)" filter="url(#soft)">
    <rect x="12" y="11" width="40" height="40" rx="10" fill="url(#shine)"/>
    <circle cx="19" cy="18" r="2.4" fill="#f472b6"/>
  </g>

  <!-- Kana glyph あ -->
  <g transform="rotate(-7 33 34)">
    <text
      x="33" y="44.5"
      text-anchor="middle"
      font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic UI','Yu Gothic','Meiryo','MS Gothic',system-ui,sans-serif"
      font-size="30"
      font-weight="800"
      fill="#4f46e5"
    >あ</text>
  </g>
</svg>
